<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sphere Volume Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f3f4f6; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 280px; }
        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, button { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #2563eb; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <h3 style="margin-top:0; text-align:center;">Sphere Volume Calculator</h3>
        <div class="group">
            <label>Radius (r):</label>
            <input type="number" id="radius" placeholder="Enter radius">
        </div>
        <div class="group">
            <label>Volume (V):</label>
            <input type="text" id="volume" readonly>
        </div>
        <button onclick="calculate()">Calculate</button>
    </div>

    <script>
        function calculate() {
            const r = parseFloat(document.getElementById('radius').value);
            if (r >= 0) {
                const volume = (4 / 3) * Math.PI * Math.pow(r, 3);
                document.getElementById('volume').value = volume.toFixed(4);
            } else {
                document.getElementById('volume').value = "Invalid input";
            }
        }
    </script>
</body>
</html>
